<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 这一页被 rm 掉了</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff7e3'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='7' fill='none' stroke='%23d89422' stroke-opacity='.5'/%3E%3Ctext x='16' y='23' font-size='20' font-family='monospace' font-weight='700' fill='%23d89422' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6faf8;
    --bg-2: #eef6f4;
    --line: rgba(18, 52, 49, 0.11);
    --line-strong: rgba(18, 52, 49, 0.18);
    --text: #102321;
    --muted: #586a67;
    --faint: #8b9996;
    --gold: #d89422;
    --cyan: #0da999;
    --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  html[data-theme="dark"] {
    --bg: #0c1512;
    --bg-2: #101c17;
    --line: rgba(232, 241, 237, 0.09);
    --line-strong: rgba(232, 241, 237, 0.17);
    --text: #e8f1ed;
    --muted: #9db3ac;
    --faint: #6d817a;
    --gold: #e6a93c;
    --cyan: #2fc4b2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 12%, rgba(13, 169, 153, 0.12), transparent 32%),
      radial-gradient(circle at 80% 8%, rgba(216, 148, 34, 0.1), transparent 30%),
      linear-gradient(145deg, var(--bg), var(--bg-2));
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
    text-align: center;
  }

  .box { max-width: 460px; }

  .cat-img {
    width: 132px;
    height: 132px;
    filter: drop-shadow(0 12px 14px rgba(15, 45, 42, 0.22));
  }

  html[data-theme="dark"] .cat-img {
    filter: drop-shadow(0 12px 14px rgba(0, 0, 0, 0.5));
  }

  h1 {
    margin-top: 6px;
    font-size: 74px;
    font-weight: 900;
    line-height: 1;
    color: transparent;
    background: linear-gradient(92deg, var(--gold), #e6b85a 42%, var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
  }

  .term {
    margin: 22px auto 8px;
    padding: 12px 16px;
    max-width: 340px;
    border: 1px solid var(--line-strong);
    border-radius: 12px;
    background: rgba(127, 127, 127, 0.06);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
    text-align: left;
  }

  .term .p { color: var(--gold); font-weight: 700; }
  .term .err { color: var(--faint); }

  .say { margin-top: 14px; color: var(--muted); font-size: 15px; }

  .home {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding: 11px 20px;
    border: 1px solid var(--line-strong);
    border-radius: 999px;
    color: var(--text);
    background: rgba(127, 127, 127, 0.05);
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.2s, border-color 0.2s;
  }

  .home:hover { transform: translateY(-2px); border-color: var(--cyan); }
</style>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>
  <div class="box">
    <picture>
      <source media="(prefers-reduced-motion: reduce)" srcset="/assets/pet-cat-idle-static.png">
      <img class="cat-img" src="/assets/pet-cat-idle.webp" alt="喵秘书坐在空荡荡的页面里" width="132" height="132">
    </picture>
    <h1>404</h1>
    <div class="term">
      <div><span class="p">$</span> cat <span id="path">这个页面</span></div>
      <div class="err">cat: 没有这个文件——这一页被主人 rm 掉了。</div>
    </div>
    <div class="say">别看我，我只负责卖萌，不负责备份。</div>
    <a class="home" href="/">$ cd ~ 回首页</a>
  </div>
  <script>
    try { document.getElementById('path').textContent = location.pathname; } catch (e) {}
  </script>
</body>
</html>
