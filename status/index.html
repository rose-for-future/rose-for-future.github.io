<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>status · lixudong 的站点监控</title>
<meta name="description" content="这个站自己的监控面板：部署时间线、运行天数、资产计数，以及那只猫的数据。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff7e3'/%3E%3Crect x='1.5' y='1.5' width='29' height='29' rx='7' fill='none' stroke='%23d89422' stroke-opacity='.5'/%3E%3Ctext x='16' y='23' font-size='20' font-family='monospace' font-weight='700' fill='%23d89422' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6faf8;
    --bg-2: #eef6f4;
    --panel: rgba(255, 255, 255, 0.75);
    --line: rgba(18, 52, 49, 0.11);
    --line-strong: rgba(18, 52, 49, 0.18);
    --text: #102321;
    --muted: #586a67;
    --faint: #8b9996;
    --gold: #d89422;
    --cyan: #0da999;
    --red: #e96b62;
    --mono: "SFMono-Regular", "Cascadia Code", "Roboto Mono", Consolas, monospace;
  }

  html[data-theme="dark"] {
    --bg: #0c1512;
    --bg-2: #101c17;
    --panel: rgba(22, 35, 30, 0.75);
    --line: rgba(232, 241, 237, 0.09);
    --line-strong: rgba(232, 241, 237, 0.17);
    --text: #e8f1ed;
    --muted: #9db3ac;
    --faint: #6d817a;
    --gold: #e6a93c;
    --cyan: #2fc4b2;
    --red: #ef8078;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    padding: 40px 20px 60px;
    color: var(--text);
    background:
      radial-gradient(circle at 16% 8%, rgba(13, 169, 153, 0.12), transparent 30%),
      radial-gradient(circle at 82% 4%, rgba(216, 148, 34, 0.1), transparent 28%),
      linear-gradient(145deg, var(--bg), var(--bg-2));
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  .term {
    max-width: 720px;
    margin: 0 auto;
    border: 1px solid var(--line-strong);
    border-radius: 20px;
    background: var(--panel);
    box-shadow: 0 28px 80px rgba(0, 0, 0, 0.18);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    overflow: hidden;
  }

  .term-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 15px 18px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--faint);
  }

  .traffic { display: flex; gap: 7px; }
  .traffic span { width: 10px; height: 10px; border-radius: 50%; }
  .traffic span:nth-child(1) { background: var(--red); }
  .traffic span:nth-child(2) { background: var(--gold); }
  .traffic span:nth-child(3) { background: var(--cyan); }

  .term-body {
    padding: 22px;
    font-family: var(--mono);
    font-size: 13.5px;
    line-height: 1.9;
  }

  .cmd { color: var(--muted); margin-bottom: 18px; }
  .cmd strong { color: var(--gold); }

  section { margin-bottom: 26px; }

  h2 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--cyan);
    margin-bottom: 10px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 6px 0;
    border-bottom: 1px dashed var(--line);
  }

  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--muted); flex-shrink: 0; }
  .row .v { text-align: right; overflow-wrap: anywhere; }

  .ok { color: var(--cyan); }
  .warn { color: var(--gold); }

  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 7px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 0 0 rgba(13, 169, 153, 0.4);
    animation: pulse 2.2s infinite;
  }

  @keyframes pulse {
    70% { box-shadow: 0 0 0 10px rgba(13, 169, 153, 0); }
    100% { box-shadow: 0 0 0 0 rgba(13, 169, 153, 0); }
  }

  .commit { display: flex; gap: 14px; padding: 5px 0; }
  .commit .d { color: var(--faint); flex-shrink: 0; }
  .commit .m { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit .sha { color: var(--gold); flex-shrink: 0; }

  .note { margin-top: 8px; color: var(--faint); font-size: 11.5px; }

  .back {
    display: inline-flex;
    margin-top: 6px;
    color: var(--gold);
    font-weight: 700;
    text-decoration: none;
  }

  .back:hover { text-decoration: underline; }

  @media (max-width: 560px) {
    body { padding: 18px 10px 40px; }
    .term-body { padding: 16px 14px; font-size: 12.5px; }
    .commit .m { white-space: normal; }
  }
</style>
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) {}
    if (t !== 'dark' && t !== 'light') {
      t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    document.documentElement.dataset.theme = t;
  })();
</script>
</head>
<body>

<div class="term">
  <div class="term-top">
    <div class="traffic"><span></span><span></span><span></span></div>
    <span>status.monitor</span>
  </div>
  <div class="term-body">
    <div class="cmd">lixudong@ai-pm <strong>$</strong> status --full</div>

    <section>
      <h2>SITE</h2>
      <div class="row"><span class="k">状态</span><span class="v ok"><span class="dot"></span>operational</span></div>
      <div class="row"><span class="k">站点运行</span><span class="v" id="uptime">—</span></div>
      <div class="row"><span class="k">当前版本</span><span class="v" id="version">—</span></div>
      <div class="row"><span class="k">托管</span><span class="v">GitHub Pages · <a class="back" href="https://github.com/rose-for-future/rose-for-future.github.io" target="_blank" rel="noopener">源码 ↗</a></span></div>
    </section>

    <section>
      <h2>ASSETS</h2>
      <div class="row"><span class="k">作品</span><span class="v">3（喵秘书 · 体素世界 · 贾维斯042）</span></div>
      <div class="row"><span class="k">Skill 常驻</span><span class="v">5</span></div>
      <div class="row"><span class="k">语音分身</span><span class="v warn">部署队列中</span></div>
      <div class="row"><span class="k">站猫</span><span class="v ok">在岗</span></div>
    </section>

    <section>
      <h2>DEPLOYS · 最近提交</h2>
      <div id="commits"><span class="note">拉取中…</span></div>
      <div class="note">数据实时来自 GitHub API</div>
    </section>

    <section>
      <h2>CAT · 你和站猫的数据</h2>
      <div class="row"><span class="k">你来过</span><span class="v" id="cat-v">—</span></div>
      <div class="row"><span class="k">投喂小鱼</span><span class="v" id="cat-fed">—</span></div>
      <div class="row"><span class="k">摸猫次数</span><span class="v" id="cat-pets">—</span></div>
      <div class="row"><span class="k">当前心情</span><span class="v" id="cat-mood">—</span></div>
      <div class="note">这组数据只存在你自己的浏览器里，我们看不到。</div>
    </section>

    <a class="back" href="/">$ cd ~ 回首页</a>
  </div>
</div>

<script>
  /* 运行天数：站点纪元 2026-06-10「个人站首发」 */
  (function () {
    var days = Math.max(1, Math.floor((Date.now() - new Date('2026-06-10T23:37:21+08:00').getTime()) / 86400000));
    document.getElementById('uptime').textContent = days + ' 天';
  })();

  /* 最近提交 + 当前版本 */
  fetch('https://api.github.com/repos/rose-for-future/rose-for-future.github.io/commits?sha=main&per_page=8')
    .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (list) {
      document.getElementById('version').textContent = list[0].sha.slice(0, 7);
      var wrap = document.getElementById('commits');
      wrap.innerHTML = '';
      list.forEach(function (c) {
        var d = new Date(c.commit.author.date);
        var ds = (d.getMonth() + 1) + '-' + String(d.getDate()).padStart(2, '0');
        var div = document.createElement('div');
        div.className = 'commit';
        var sd = document.createElement('span'); sd.className = 'd'; sd.textContent = ds;
        var ss = document.createElement('span'); ss.className = 'sha'; ss.textContent = c.sha.slice(0, 7);
        var sm = document.createElement('span'); sm.className = 'm'; sm.textContent = c.commit.message.split('\n')[0];
        div.appendChild(sd); div.appendChild(ss); div.appendChild(sm);
        wrap.appendChild(div);
      });
    })
    .catch(function () {
      document.getElementById('commits').innerHTML = '<span class="note">GitHub API 限流了，过会儿再来看。</span>';
    });

  /* 猫的数据（localStorage） */
  (function () {
    var m = { v: 0, fed: 0, pets: 0, m: 70 };
    try { m = Object.assign(m, JSON.parse(localStorage.getItem('cat-memory') || '{}')); } catch (e) {}
    document.getElementById('cat-v').textContent = m.v + ' 次';
    document.getElementById('cat-fed').textContent = m.fed + ' 条';
    document.getElementById('cat-pets').textContent = m.pets + ' 次';
    var mood = m.m || 70;
    document.getElementById('cat-mood').textContent = mood + '/100 ' + (mood >= 85 ? '😻' : mood >= 60 ? '😺' : '😾');
  })();
</script>

</body>
</html>
