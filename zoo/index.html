<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>早读动物园 · 声音越洪亮，动物越多</title>
<meta name="description" content="给早读课做的游戏化分贝计：齐声朗读，音量达标就有像素小动物冒出来。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23bfe9a6'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle'%3E🐣%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --ink: #23331f;
    --panel: #fffdf5;
    --accent: #3fa34d;
    --accent-dark: #2f7f3a;
    --gold: #f2a63a;
    --line: rgba(35, 51, 31, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: #7cc3e8;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }

  .hidden { display: none !important; }

  /* ===== 顶部 HUD ===== */
  #hud {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    z-index: 5;
  }

  .hud-box {
    background: rgba(255, 253, 245, 0.92);
    border: 3px solid var(--ink);
    border-radius: 10px;
    box-shadow: 0 4px 0 rgba(35, 51, 31, 0.35);
    padding: 8px 12px;
    font-weight: 800;
    font-size: 14px;
    white-space: nowrap;
  }

  #meter-box {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #meter {
    position: relative;
    flex: 1;
    height: 22px;
    background: #e8e3d2;
    border-radius: 6px;
    overflow: hidden;
  }

  #meter-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, #8bd17c, #3fa34d);
    transition: width 0.09s linear;
  }

  #meter-fill.hot { background: linear-gradient(90deg, #ffd94a, #f2a63a); }

  #meter-target {
    position: absolute;
    top: -3px;
    bottom: -3px;
    width: 4px;
    background: #e2574c;
    border-radius: 2px;
  }

  .hud-num { color: var(--accent-dark); }
  #streak-box .hud-num { color: #c47a12; }

  /* ===== 覆盖层（配置 / 总结） ===== */
  .overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: rgba(35, 51, 31, 0.28);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 10;
  }

  .card {
    width: min(480px, 100%);
    max-height: 92vh;
    overflow: auto;
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 18px;
    box-shadow: 0 10px 0 rgba(35, 51, 31, 0.4);
    padding: 28px 26px;
    text-align: center;
  }

  .card .logo { font-size: 52px; line-height: 1.1; }
  .card h1 { font-size: 26px; margin: 8px 0 4px; letter-spacing: 2px; }
  .card .tagline { color: #6f7d68; font-size: 14px; margin-bottom: 20px; }

  .perm {
    text-align: left;
    font-size: 13px;
    line-height: 1.6;
    border: 2px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    background: #fbf7ea;
  }

  .perm b { display: block; }
  .perm.ok { background: #edf8ea; border-color: #9ccf90; }
  .perm.bad { background: #fdeeec; border-color: #efb0a8; }

  .field { text-align: left; margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; font-weight: 800; margin-bottom: 8px; }

  #th-slider { width: 100%; accent-color: var(--accent); }

  .th-marks {
    display: flex;
    justify-content: space-between;
    color: #8a9482;
    font-size: 11px;
    margin-top: 4px;
  }

  .btn {
    appearance: none;
    border: 3px solid var(--ink);
    border-radius: 12px;
    background: var(--accent);
    color: #fff;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 1px;
    padding: 12px 18px;
    width: 100%;
    cursor: pointer;
    box-shadow: 0 5px 0 var(--accent-dark);
    transition: transform 0.06s, box-shadow 0.06s;
  }

  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn:disabled { opacity: 0.55; cursor: not-allowed; }
  .btn + .btn { margin-top: 10px; }

  .btn.ghost {
    background: #fffdf5;
    color: var(--ink);
    box-shadow: 0 5px 0 rgba(35, 51, 31, 0.3);
  }

  .foot-note { margin-top: 14px; color: #8a9482; font-size: 12px; }
  .foot-note a { color: var(--accent-dark); font-weight: 700; text-decoration: none; }

  /* ===== 总结 ===== */
  #summary .big { font-size: 44px; font-weight: 900; color: var(--accent-dark); line-height: 1.1; }
  .sum-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 18px 0 22px; }
  .sum-cell { background: #f4f0e2; border-radius: 10px; padding: 12px 6px; }
  .sum-cell .v { font-size: 22px; font-weight: 900; }
  .sum-cell .k { font-size: 11px; color: #8a9482; margin-top: 2px; }

  /* ===== 游戏中按钮 ===== */
  #end-btn {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 6;
    width: auto;
    font-size: 14px;
    padding: 10px 16px;
  }

  #milestone {
    position: fixed;
    top: 22%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 7;
    background: var(--panel);
    border: 4px solid var(--ink);
    border-radius: 14px;
    box-shadow: 0 8px 0 rgba(35, 51, 31, 0.4);
    padding: 14px 26px;
    font-size: 22px;
    font-weight: 900;
    white-space: nowrap;
    pointer-events: none;
  }

  #milestone.show { animation: msPop 2.4s cubic-bezier(0.2, 1.4, 0.4, 1) forwards; }

  @keyframes msPop {
    0% { transform: translate(-50%, -50%) scale(0); }
    14% { transform: translate(-50%, -50%) scale(1.06); }
    22%, 82% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(0.9); opacity: 0; }
  }

  @media (max-width: 560px) {
    #hud { flex-wrap: wrap; gap: 8px; padding: 10px; }
    #meter-box { order: -1; width: 100%; flex-basis: 100%; }
    .hud-box { font-size: 12px; padding: 6px 9px; }
    .sum-grid { gap: 6px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="hud" class="hidden">
  <div class="hud-box" id="meter-box">
    <span>🔊</span>
    <div id="meter"><div id="meter-fill"></div><div id="meter-target"></div></div>
  </div>
  <div class="hud-box">🐾 <span class="hud-num" id="count-num">0</span></div>
  <div class="hud-box" id="streak-box">🔥 <span class="hud-num" id="streak-num">0s</span></div>
</div>

<button class="btn ghost hidden" id="end-btn">🔔 下课</button>
<div id="milestone"></div>

<div class="overlay" id="config">
  <div class="card">
    <div class="logo">🐣</div>
    <h1>早读动物园</h1>
    <div class="tagline">全班齐声朗读，声音越洪亮，草地上的小动物就越多</div>

    <div class="perm" id="perm-box"><b>🎤 需要麦克风</b>点「开始早读」时浏览器会请求麦克风权限，声音只在本地计算，不上传、不录音。</div>

    <div class="field">
      <label>目标音量 · 要多大声才算达标？</label>
      <input type="range" id="th-slider" min="1" max="5" step="1" value="3">
      <div class="th-marks"><span>轻声读</span><span>正常齐读</span><span>气势拉满</span></div>
    </div>

    <button class="btn" id="start-btn">🎤 开始早读</button>
    <button class="btn ghost" id="demo-btn">🎬 没有麦克风？看演示</button>

    <div class="foot-note">一个单文件小实验 · <a href="../" target="_top">← 回 lixudong 的个站</a></div>
  </div>
</div>

<div class="overlay hidden" id="summary">
  <div class="card">
    <div class="logo">🎉</div>
    <h1>下课啦</h1>
    <div class="big" id="sum-count">0 只</div>
    <div class="tagline">小动物来到了你们的草地</div>
    <div class="sum-grid">
      <div class="sum-cell"><div class="v" id="sum-streak">0s</div><div class="k">最长连续达标</div></div>
      <div class="sum-cell"><div class="v" id="sum-rate">0%</div><div class="k">达标时间占比</div></div>
      <div class="sum-cell"><div class="v" id="sum-time">0:00</div><div class="k">本次早读时长</div></div>
    </div>
    <button class="btn" id="again-btn">再来一节</button>
  </div>
</div>

<script>
/* ============================================================
   早读动物园 v2 · canvas 像素风
   麦克风 RMS → 平滑音量 → 达标蓄能 → 生成像素小动物
   ============================================================ */

/* ---------- 像素精灵 ---------- */
const PAL = {
  y: '#ffd94a', o: '#f28c28', k: '#2b2b2b', w: '#ffffff',
  p: '#ffb3c7', g: '#bcbcbc', r: '#e8622c', c: '#fff2d8',
  b: '#8c5a2b', G: '#3fa34d',
};

/* 每个物种两帧；'.' 为透明 */
const SPRITES = {
  chick: [[
    '...yy...',
    '..yyyy..',
    '..ykyy..',
    '.yyyyyo.',
    '.yyyyy..',
    '..yyyy..',
    '...o.o..',
  ], [
    '...yy...',
    '..yyyy..',
    '..ykyy..',
    '.yyyyyo.',
    '.yyyyy..',
    '..yyyy..',
    '..o..o..',
  ]],
  rabbit: [[
    '.w..w...',
    '.wp.wp..',
    '.w..w...',
    '.wwww...',
    'wwkwww..',
    '.wwwwww.',
    '.wwwwww.',
    '..w..w..',
  ], [
    '.w..w...',
    '.wp.wp..',
    '.w..w...',
    '.wwww...',
    'wwkwww..',
    '.wwwwww.',
    '.wwwwww.',
    '.w....w.',
  ]],
  fox: [[
    'r....r..',
    'rr..rr..',
    'rrrrrr..',
    'rkrrkr..',
    'rrrcrr..',
    '.rrrrrrr',
    '.rcccr.w',
    '..r..r..',
  ], [
    'r....r..',
    'rr..rr..',
    'rrrrrr..',
    'rkrrkr..',
    'rrrcrr..',
    '.rrrrrrw',
    '.rcccr..',
    '.r....r.',
  ]],
  panda: [[
    '.k....k.',
    '.wwwwww.',
    '.wkwwkw.',
    '.wwwwww.',
    'kwwwwwwk',
    'kwwwwwwk',
    '.kwwwwk.',
    '..k..k..',
  ], [
    '.k....k.',
    '.wwwwww.',
    '.wkwwkw.',
    '.wwwwww.',
    'kwwwwwwk',
    'kwwwwwwk',
    '.kwwwwk.',
    '.k....k.',
  ]],
};

/* 里程碑解锁顺序与文案 */
const SPECIES_ORDER = ['chick', 'rabbit', 'fox', 'panda'];
const MILESTONES = {
  5:  '🐰 兔子被你们的读书声吸引来了！',
  12: '🦊 狐狸也来听课了，保持住！',
  20: '🐼 熊猫都惊动了，你们太棒了！',
  30: '🌈 整片草地都是你们的听众！',
};

const SCALE_BASE = 5;

/* ---------- 精灵编译 ---------- */
function bake(grid) {
  const h = grid.length, w = Math.max(...grid.map((r) => r.length));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const c = cv.getContext('2d');
  grid.forEach((row, y) => {
    [...row].forEach((ch, x) => {
      if (ch !== '.') { c.fillStyle = PAL[ch] || '#000'; c.fillRect(x, y, 1, 1); }
    });
  });
  return cv;
}
const BAKED = {};
for (const k in SPRITES) BAKED[k] = SPRITES[k].map(bake);

/* ---------- 场景 ---------- */
const scene = document.getElementById('scene');
const ctx = scene.getContext('2d');
let W = 0, H = 0, DPR = 1, groundY = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = scene.width = Math.floor(innerWidth * DPR);
  H = scene.height = Math.floor(innerHeight * DPR);
  groundY = Math.floor(H * 0.62);
}
addEventListener('resize', resize);
resize();

const rnd = (a, b) => a + Math.random() * (b - a);

/* 云 */
const clouds = Array.from({ length: 4 }, (_, i) => ({
  x: rnd(0, 1), y: rnd(0.06, 0.3), s: rnd(0.5, 1), v: rnd(0.004, 0.012) * (i % 2 ? 1 : 1.6),
}));

/* 草丛点缀 */
let tufts = [];
function seedTufts() {
  tufts = Array.from({ length: 26 }, () => ({ x: Math.random(), y: Math.random(), tall: Math.random() > 0.6 }));
}
seedTufts();

/* ---------- 实体 ---------- */
let animals = [];
let particles = [];
let floaties = [];

function spawnAnimal() {
  const unlocked = Math.min(1 + Math.floor(animals.length / 6), SPECIES_ORDER.length);
  const sp = SPECIES_ORDER[Math.floor(Math.random() * unlocked)];
  const scale = SCALE_BASE * DPR * rnd(0.8, 1.15);
  const a = {
    sp, scale,
    x: rnd(0.08, 0.92) * W,
    y: rnd(groundY + 10 * DPR, H - 30 * DPR),
    dir: Math.random() > 0.5 ? 1 : -1,
    vx: rnd(3, 9) * DPR,
    frame: 0, ft: rnd(0, 0.4),
    hop: 0, hopT: rnd(1, 4),
    born: 0,
  };
  animals.push(a);
  for (let i = 0; i < 14; i++) {
    particles.push({
      x: a.x, y: a.y - 8 * DPR, life: 1,
      vx: rnd(-40, 40) * DPR, vy: rnd(-70, -20) * DPR,
      col: ['#ffd94a', '#8bd17c', '#ffb3c7', '#fff'][i % 4],
    });
  }
  floaties.push({ x: a.x, y: a.y - 26 * DPR, life: 1, text: '+1' });
  const ms = MILESTONES[animals.length];
  if (ms) showMilestone(ms);
}

function showMilestone(text) {
  const el = document.getElementById('milestone');
  el.textContent = text;
  el.classList.remove('show');
  void el.offsetWidth;
  el.classList.add('show');
  for (let i = 0; i < 50; i++) {
    particles.push({
      x: rnd(0.2, 0.8) * W, y: rnd(0.1, 0.3) * H, life: rnd(1, 1.6),
      vx: rnd(-60, 60) * DPR, vy: rnd(10, 90) * DPR,
      col: ['#ffd94a', '#e2574c', '#8bd17c', '#7cc3e8', '#ffb3c7'][i % 5],
    });
  }
}

/* ---------- 渲染 ---------- */
function draw(dt) {
  /* 天空 */
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#7cc3e8');
  sky.addColorStop(1, '#cdeffd');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  /* 太阳 */
  const su = 26 * DPR;
  const sx = W * 0.76, sy = groundY * 0.18;
  ctx.fillStyle = 'rgba(255,217,74,.45)';
  ctx.fillRect(sx - 6 * DPR, sy - 6 * DPR, su * 1.6 + 12 * DPR, su * 1.6 + 12 * DPR);
  ctx.fillStyle = '#ffd94a';
  ctx.fillRect(sx, sy, su * 1.6, su * 1.6);

  /* 云（像素块组合） */
  ctx.fillStyle = '#ffffff';
  clouds.forEach((cl) => {
    cl.x += cl.v * dt; if (cl.x > 1.15) cl.x = -0.18;
    const cx = cl.x * W, cy = cl.y * groundY, u = 10 * DPR * cl.s;
    ctx.fillRect(cx, cy, u * 5, u * 1.6);
    ctx.fillRect(cx + u, cy - u, u * 3, u);
    ctx.fillRect(cx + u * 0.5, cy + u * 1.6, u * 4, u * 0.7);
  });

  /* 地平线像素山丘 */
  ctx.fillStyle = '#b7e39b';
  [[0.06, 9], [0.32, 14], [0.62, 8], [0.86, 12]].forEach(([rx, hh]) => {
    const bw = hh * 6 * DPR, bh = hh * DPR, bx = rx * W;
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(bx + i * bw * 0.11, groundY - bh + i * bh * 0.28, bw * (1 - i * 0.22), bh * 0.3);
    }
  });

  /* 地平线小树 */
  [[0.14, 1], [0.47, 1.3], [0.71, 0.9], [0.93, 1.1]].forEach(([rx, ts]) => {
    const u = 5 * DPR * ts, tx = rx * W, ty = groundY;
    ctx.fillStyle = '#8c5a2b';
    ctx.fillRect(tx - u * 0.3, ty - u * 1.6, u * 0.6, u * 1.6);
    ctx.fillStyle = '#5fae57';
    ctx.fillRect(tx - u * 1.2, ty - u * 3, u * 2.4, u * 1.6);
    ctx.fillRect(tx - u * 0.8, ty - u * 3.8, u * 1.6, u);
  });

  /* 草地两层 */
  ctx.fillStyle = '#a4dd86';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#8fd06e';
  ctx.fillRect(0, groundY, W, 8 * DPR);
  ctx.fillStyle = '#95d477';
  tufts.forEach((tf) => {
    const tx = tf.x * W, ty = groundY + tf.y * (H - groundY);
    const u = 3 * DPR;
    ctx.fillRect(tx, ty, u, tf.tall ? u * 3 : u * 2);
    ctx.fillRect(tx - u, ty + u, u, u);
    ctx.fillRect(tx + u, ty + u, u, u);
  });

  /* 动物（按 y 排序制造前后层次） */
  animals.sort((a, b) => a.y - b.y);
  animals.forEach((a) => {
    a.born = Math.min(1, a.born + dt * 3);
    a.ft += dt;
    if (a.ft > 0.28) { a.ft = 0; a.frame = 1 - a.frame; }
    a.hopT -= dt;
    if (a.hopT <= 0) { a.hopT = rnd(1.6, 5); a.hop = 1; a.dir = Math.random() > 0.5 ? 1 : -1; }
    let jump = 0;
    if (a.hop > 0) {
      a.hop = Math.max(0, a.hop - dt * 2.2);
      jump = Math.sin((1 - a.hop) * Math.PI) * 9 * DPR;
      a.x += a.vx * a.dir * dt * 6;
      a.x = Math.max(14 * DPR, Math.min(W - 14 * DPR, a.x));
    }
    const img = BAKED[a.sp][a.frame];
    const s = a.scale * (0.5 + 0.5 * a.born);
    const w = img.width * s, h = img.height * s;
    ctx.save();
    ctx.translate(Math.round(a.x), Math.round(a.y));
    ctx.globalAlpha = a.born;
    ctx.fillStyle = 'rgba(35,51,31,.16)';
    ctx.fillRect(-w / 2, -2 * DPR, w, 3 * DPR);
    ctx.scale(a.dir, 1);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, -w / 2, -h - jump, w, h);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  /* 粒子 */
  particles = particles.filter((p) => (p.life -= dt) > 0);
  particles.forEach((p) => {
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * DPR * dt;
    ctx.fillStyle = p.col;
    ctx.globalAlpha = Math.min(1, p.life);
    const u = 3 * DPR;
    ctx.fillRect(p.x, p.y, u, u);
  });
  ctx.globalAlpha = 1;

  /* +1 浮字 */
  floaties = floaties.filter((f) => (f.life -= dt * 0.8) > 0);
  floaties.forEach((f) => {
    f.y -= 30 * DPR * dt;
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.fillStyle = '#2f7f3a';
    ctx.font = `900 ${16 * DPR}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

/* ---------- 音频 ---------- */
let audioCtx = null, analyser = null, dataArr = null, micStream = null;
let noiseFloor = 0.004;
let demoMode = false;

async function initMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const src = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  src.connect(analyser);
  dataArr = new Float32Array(analyser.fftSize);
}

function readRMS() {
  if (demoMode) {
    /* 演示模式：模拟一个班从安静到齐读的起伏，多数时间在阈值线附近拉扯 */
    const t = performance.now() / 1000;
    const base = 0.72 + 0.3 * Math.sin(t / 3.6) + 0.16 * Math.sin(t / 1.1 + 1.7) + 0.06 * Math.sin(t * 3.7);
    return Math.max(0.15, base) * 0.12;
  }
  if (!analyser) return 0;
  analyser.getFloatTimeDomainData(dataArr);
  let sum = 0;
  for (let i = 0; i < dataArr.length; i++) { const v = dataArr[i]; sum += v * v; }
  return Math.sqrt(sum / dataArr.length);
}

function collectNoiseFloor() {
  return new Promise((resolve) => {
    const samples = [];
    const t0 = performance.now();
    const id = setInterval(() => {
      samples.push(readRMS());
      if (performance.now() - t0 >= 1500) {
        clearInterval(id);
        samples.sort((a, b) => a - b);
        noiseFloor = Math.max(0.002, samples[Math.floor(samples.length / 2)] || 0.002);
        resolve();
      }
    }, 60);
  });
}

/* ---------- 游戏状态 ---------- */
const hud = document.getElementById('hud');
const meterFill = document.getElementById('meter-fill');
const meterTarget = document.getElementById('meter-target');
const countNum = document.getElementById('count-num');
const streakNum = document.getElementById('streak-num');
const configEl = document.getElementById('config');
const summaryEl = document.getElementById('summary');
const permBox = document.getElementById('perm-box');
const endBtn = document.getElementById('end-btn');

let running = false;
let smooth = 0, energy = 0, spawnCost = 1.6;
let streak = 0, bestStreak = 0, hotTime = 0, totalTime = 0;
let thMult = 6;
let lastT = 0;

const TH_MULTS = { 1: 2.5, 2: 4, 3: 6, 4: 9, 5: 13 };

function threshold() { return noiseFloor * thMult; }
/* 阈值线固定画在音量条 45% 处，满刻度反推 */
function meterMax() { return threshold() / 0.45; }

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
  lastT = t;

  if (running) {
    const rms = readRMS();
    smooth += (rms - smooth) * Math.min(1, dt * 9);
    const ratio = Math.min(1, smooth / meterMax());
    meterFill.style.width = (ratio * 100).toFixed(1) + '%';
    const hot = smooth >= threshold();
    meterFill.classList.toggle('hot', hot);

    totalTime += dt;
    if (hot) {
      hotTime += dt;
      streak += dt;
      bestStreak = Math.max(bestStreak, streak);
      energy += dt * (1 + Math.min(1.2, streak / 25));
      if (energy >= spawnCost && animals.length < 48) {
        energy = 0;
        spawnCost = 1.6 + animals.length * 0.09;
        spawnAnimal();
      }
    } else {
      streak = 0;
      energy = Math.max(0, energy - dt * 0.4);
    }
    countNum.textContent = animals.length;
    streakNum.textContent = Math.floor(streak) + 's';
  }

  draw(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
meterTarget.style.left = '45%';

/* ---------- 流程 ---------- */
document.getElementById('th-slider').addEventListener('input', (e) => {
  thMult = TH_MULTS[e.target.value];
});
thMult = TH_MULTS[document.getElementById('th-slider').value];

async function startSession(demo) {
  demoMode = demo;
  const startBtn = document.getElementById('start-btn');
  startBtn.disabled = true;
  if (!demo) {
    try {
      await initMic();
      permBox.className = 'perm ok';
      permBox.innerHTML = '<b>✅ 麦克风就绪</b>正在测 1.5 秒环境底噪，请保持安静…';
      await collectNoiseFloor();
    } catch (err) {
      startBtn.disabled = false;
      permBox.className = 'perm bad';
      const insecure = !window.isSecureContext;
      permBox.innerHTML = insecure
        ? '<b>⚠️ 当前是 HTTP 访问</b>浏览器只在 HTTPS 下开放麦克风。可以先点「看演示」，或改用 https 地址访问。'
        : (err && err.name === 'NotAllowedError'
          ? '<b>⚠️ 麦克风被拒绝</b>请在浏览器地址栏的权限设置里允许麦克风后重试，或先看演示。'
          : '<b>⚠️ 无法访问麦克风</b>' + (err && err.message ? err.message : '未知错误') + '，可以先看演示。');
      return;
    }
  } else {
    noiseFloor = 0.014;
  }
  animals = []; particles = []; floaties = [];
  energy = 0; spawnCost = 1.6; streak = 0; bestStreak = 0; hotTime = 0; totalTime = 0;
  seedTufts();
  configEl.classList.add('hidden');
  summaryEl.classList.add('hidden');
  hud.classList.remove('hidden');
  endBtn.classList.remove('hidden');
  startBtn.disabled = false;
  running = true;
}

document.getElementById('start-btn').addEventListener('click', () => startSession(false));
document.getElementById('demo-btn').addEventListener('click', () => startSession(true));

endBtn.addEventListener('click', () => {
  running = false;
  hud.classList.add('hidden');
  endBtn.classList.add('hidden');
  document.getElementById('sum-count').textContent = animals.length + ' 只';
  document.getElementById('sum-streak').textContent = Math.floor(bestStreak) + 's';
  document.getElementById('sum-rate').textContent = totalTime > 0 ? Math.round((hotTime / totalTime) * 100) + '%' : '0%';
  const m = Math.floor(totalTime / 60), s = Math.floor(totalTime % 60);
  document.getElementById('sum-time').textContent = m + ':' + String(s).padStart(2, '0');
  summaryEl.classList.remove('hidden');
});

document.getElementById('again-btn').addEventListener('click', () => {
  summaryEl.classList.add('hidden');
  configEl.classList.remove('hidden');
});
</script>
